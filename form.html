<!DOCTYPE html>
<html lang="ja">
  <head
    prefix="og: http://ogp.me/ns# fb: http://ogp.me/ns/fb# article: http://ogp.me/ns/article#"
  >
    <meta charset="UTF-8" />
    <title>インサイダーゲームツール</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="インサイダーゲームのLINEBOTを公開しています。"
    />
    <meta
      name="keywords"
      content="インサイダーゲーム,人狼,インサイダーゲームツール,正体隠匿,ボードゲーム,ラインボット,インサイダー,インサイダーツール"
    />
    <link rel="stylesheet" href="./contents/css/style.css" />
    <link
      rel="icon"
      type="image/vnd.microsoft.icon"
      href="./contents/img/favicon.ico"
    />
    <meta property="og:site_name" content="インサイダーゲームツール" />
    <meta property="og:title" content="特殊村作成" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://insidergametool.netlify.app" />
    <meta
      property="og:image"
      content="https://insidergametool.netlify.app/contents/img/usagiOGP.png"
    />
    <meta
      property="og:description"
      content="特殊な配役をしたい場合はこちらから"
    />
    <meta property="og:locale" content="ja_JP" />
    <link rel="stylesheet" href="/src/styles/tailwind.css" />
    <script type="module" src="/src/pages/form.ts"></script>
  </head>
  <body class="eqnoreboot">
    {{> header}}
    <div id="container">
      <header>
        {{> logo}}
      </header>
      <div
        id="contents"
        class="box box-border mx-auto w-full !px-[15px] sm:max-w-[540px] md:max-w-[720px] lg:max-w-[960px] xl:max-w-[1140px] 2xl:max-w-[1320px]"
      >
        <section>
          <h2 class="text-center !text-[2rem] !font-medium !leading-[1.2]">
            特殊村作成
          </h2>
          <div class="relative -mx-[15px] flex flex-wrap justify-center pb-5">
            <div>
              <div class="spinner_area">
                <input
                  type="number"
                  value="5"
                  class="counter1 text-right w-1/4 countlabel"
                  data-max="20"
                  data-min="2"
                  disabled
                />
                <label class="countlabel">人の村です　　</label>
                <input
                  type="button"
                  value="＋"
                  class="btnspinner"
                  data-cal="1"
                  data-target=".counter1"
                />
                <input
                  type="button"
                  value="－"
                  class="btnspinner"
                  data-cal="-1"
                  data-target=".counter1"
                />
              </div>
              <div class="group">
                <div class="userdiv">
                  <img src="./contents/img/usagi.png" />
                  <label>参加者1</label>
                  <div class="messageInput">
                    <textarea
                      class="block box-border w-full rounded border border-gray-300 bg-white !px-3 !py-1.5 text-base leading-normal text-gray-700 focus:border-blue-500 focus:outline-none"
                      name="message"
                      placeholder="送りたいメッセージを入力"
                      maxlength="150"
                    ></textarea>
                  </div>
                </div>
                <div class="userdiv">
                  <img src="./contents/img/usagi.png" />
                  <label>参加者2</label>
                  <div class="messageInput">
                    <textarea
                      class="block box-border w-full rounded border border-gray-300 bg-white !px-3 !py-1.5 text-base leading-normal text-gray-700 focus:border-blue-500 focus:outline-none"
                      name="message"
                      placeholder="送りたいメッセージを入力"
                      maxlength="150"
                    ></textarea>
                  </div>
                </div>
                <div class="userdiv">
                  <img src="./contents/img/usagi.png" />
                  <label>参加者3</label>
                  <div class="messageInput">
                    <textarea
                      class="block box-border w-full rounded border border-gray-300 bg-white !px-3 !py-1.5 text-base leading-normal text-gray-700 focus:border-blue-500 focus:outline-none"
                      name="message"
                      placeholder="送りたいメッセージを入力"
                      maxlength="150"
                    ></textarea>
                  </div>
                </div>
                <div class="userdiv">
                  <img src="./contents/img/usagi.png" />
                  <label>参加者4</label>
                  <div class="messageInput">
                    <textarea
                      class="block box-border w-full rounded border border-gray-300 bg-white !px-3 !py-1.5 text-base leading-normal text-gray-700 focus:border-blue-500 focus:outline-none"
                      name="message"
                      placeholder="送りたいメッセージを入力"
                      maxlength="150"
                    ></textarea>
                  </div>
                </div>
                <div class="userdiv">
                  <img src="./contents/img/usagi.png" />
                  <label>参加者5</label>
                  <div class="messageInput">
                    <textarea
                      class="block box-border w-full rounded border border-gray-300 bg-white !px-3 !py-1.5 text-base leading-normal text-gray-700 focus:border-blue-500 focus:outline-none"
                      name="message"
                      placeholder="送りたいメッセージを入力"
                      maxlength="150"
                    ></textarea>
                  </div>
                </div>
              </div>
              <input type="hidden" name="button" value="create" />

              <div class="buttonarea">
                <button class="button" type="button">村作成</button>
                <div
                  class="success-alert infomessage w-full rounded border border-green-300 bg-green-100 p-3 text-green-800"
                  role="alert"
                >
                  <strong id="villagenum"></strong
                  >村を作成しました。<br />参加者へ番号を伝えてください
                </div>
                <div
                  class="danger-alert infomessage w-full rounded border border-red-300 bg-red-100 p-3 text-red-800"
                  role="alert"
                >
                  異常が発生しました。
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
      <!--/contents-->
      {{> footer}}
    </div>
    <!--/container-->
  </body>
</html>
